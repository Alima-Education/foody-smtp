services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1" # satu proxy (nginx) di depan app
    ports:
      - "127.0.0.1:3001:3001" # hanya loopback: nginx di host bisa akses, internet tidak
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
